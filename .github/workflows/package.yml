name: Windows setup preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  package:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-engine.txt
      - run: python tools/check_content.py --tracked
      - run: python tools/prepare_installation.py
      - run: python tools/build_launcher.py --toolchain local/build-tools/native/msys64/ucrt64/bin
      - run: python tools/check_launcher.py
      - run: python tools/build_setup.py --toolchain local/build-tools/native/msys64/ucrt64/bin
      - run: python tools/test_setup_installation.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DekuForge-Windows-preview
          if-no-files-found: error
          retention-days: 7
          path: |
            build/releases/DekuForge-Setup.exe
            build/releases/DekuForge-launcher-*-windows.zip
            build/releases/DekuForge-release.json
