name: Independent Windows packages
on:
  push:
    branches: [independent]
    tags: ['v*-preview.*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  package:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - run: python -m pip install Pillow==12.0.0
      - name: Stamp commit identity
        if: github.ref_type == 'branch'
        shell: python
        run: |
          import json, os
          from pathlib import Path
          path = Path('dekuforge/components.json')
          components = json.loads(path.read_text(encoding='utf-8'))
          launcher = components['launcher']
          base = launcher['version'].split('-', 1)[0]
          launcher['version'] = f"{base}-experimental.{os.environ['GITHUB_RUN_NUMBER']}.{os.environ['GITHUB_RUN_ATTEMPT']}"
          launcher['commit'] = os.environ['GITHUB_SHA']
          path.write_text(json.dumps(components, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              print(f"FORGE_VERSION={launcher['version']}", file=env)
      - name: Prepare verified Windows compiler
        shell: python
        run: |
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from tools.provision_open_tools import PINS, archive, unpack
          base = Path('local/build-tools').resolve()
          base.mkdir(parents=True, exist_ok=True)
          pin = PINS[0]
          unpack(archive(base, pin), pin[4], base / pin[5])
      - run: python tools/build_launcher.py --toolchain local/build-tools/hookshot-llvm-20261104/bin
      - run: python tools/build_setup.py --toolchain local/build-tools/hookshot-llvm-20261104/bin
      - name: Test clean native setup for Preview
        if: github.ref_type == 'tag'
        run: python tools/test_independent_setup.py --with-tools
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.ref_type == 'branch'
        with:
          name: dekuforge-windows-${{ env.FORGE_VERSION }}-${{ github.sha }}
          path: build/releases/DekuForge-launcher-${{ env.FORGE_VERSION }}-windows.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.ref_type == 'tag'
        with:
          name: DekuForge-independent-preview
          path: |
            build/releases/DekuForge-Setup.exe
            build/releases/DekuForge-independent-release.json
            build/releases/DekuForge-launcher-*-windows.zip
          if-no-files-found: error
